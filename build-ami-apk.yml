name: Build AMI Android APK (Android 16)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-ami-apk.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build debug APK with official Android tooling
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AMI project
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 16 platform and Build Tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate output APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -15
      - name: Downloadable AMI APK
        uses: actions/upload-artifact@v4
        with:
          name: AMI-Android16-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
